<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>
<body>

    <h1>Attendance System</h1>

    <form method="POST">

        <input type="text"
        name="name"
        placeholder="Student name">

        <button type="submit">
            Add
        </button>

    </form>

    <hr>

    {% for student in students %}

        <h2>{{ student }}</h2>

        <a href="/delete/{{ loop.index0 }}">
            Remove
        </a>

        <hr>

    {% endfor %}

</body>
</html>
